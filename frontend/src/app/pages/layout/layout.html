<div class="layout-container">
  <nav class="navbar">
    <div class="navbar-left">
      <button type="button" class="sidebar-toggle" id="sidebarToggle" (click)="toggleSidebar()"
        [attr.aria-expanded]="!isSidebarCollapsed" aria-label="Toggle sidebar">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="3" y1="6" x2="21" y2="6"></line>
          <line x1="3" y1="12" x2="21" y2="12"></line>
          <line x1="3" y1="18" x2="21" y2="18"></line>
        </svg>
      </button>
      <div class="navbar-brand">
        <div class="brand-logo">EMS</div>
        <div class="brand-info">
          <span class="brand-text">Employee Management</span>
          <span class="portal-badge">Admin</span>
        </div>
      </div>
    </div>

    <div class="navbar-right">
      <div class="user-info">
        <div class="user-avatar-wrapper">
          <img class="user-avatar-img" [src]="'https://ui-avatars.com/api/?name=' + (loggedUserData?.employeeName || 'Admin') + '&background=ffffff&color=993c1d&bold=true'" alt="User Avatar" />
          <span class="status-dot" title="Active"></span>
        </div>
        <div class="user-details">
          <span class="user-name">{{loggedUserData?.employeeName || 'Administrator'}}</span>
          <span class="user-role">{{loggedUserData?.role || 'Admin'}}</span>
        </div>
      </div>
      <button class="logout-btn" (click)="onLogOff()" title="Sign out of account">
        <svg class="logout-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
          <polyline points="16 17 21 12 16 7"></polyline>
          <line x1="21" y1="12" x2="9" y2="12"></line>
        </svg>
        <span>Log Off</span>
      </button>
    </div>
  </nav>

  <div class="layout-body">
    <aside class="sidebar" id="sidebar" [class.collapsed]="isSidebarCollapsed">
      <ul class="nav-menu">
        <li class="nav-item">
          <a routerLink="/admin/dashboard" routerLinkActive="active" class="nav-link">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="3" y="3" width="7" height="7"></rect>
              <rect x="14" y="3" width="7" height="7"></rect>
              <rect x="14" y="14" width="7" height="7"></rect>
              <rect x="3" y="14" width="7" height="7"></rect>
            </svg>
            <span>Dashboard</span>
          </a>
        </li>
        <li class="nav-item">
          <a routerLink="/admin/employee-list" routerLinkActive="active" class="nav-link">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
              <circle cx="9" cy="7" r="4"></circle>
              <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
              <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
            </svg>
            <span>Employees</span>
          </a>
        </li>
        <li class="nav-item">
          <a routerLink="/admin/projects" routerLinkActive="active" class="nav-link">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path>
              <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path>
            </svg>
            <span>Projects</span>
          </a>
        </li>
        <li class="nav-item">
          <a routerLink="/admin/project-assignment" routerLinkActive="active" class="nav-link">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M12 5v14M5 12h14"></path>
            </svg>
            <span>Assignments</span>
          </a>
        </li>
      </ul>
    </aside>

    <main class="main-content">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>
